<style>
  .breadcrumb { font-family: monospace; font-size: 0.8rem; color: #6b7280; margin-bottom: 0.75rem; word-break: break-all; }
  .dir-list { list-style: none; margin-bottom: 1rem; }
  .dir-list li + li { border-top: 1px solid #f3f4f6; }
  .dir-btn {
    display: block;
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    padding: 0.5rem 0.25rem;
    cursor: pointer;
    font-family: monospace;
    font-size: 0.85rem;
    color: #1d4ed8;
  }
  .dir-btn:hover { background: #eff6ff; border-radius: 4px; }
  .up-btn { color: #6b7280; }
  .empty { color: #9ca3af; font-size: 0.85rem; padding: 0.5rem 0; }
  .select-bar {
    border-top: 1px solid #e5e7eb;
    padding-top: 1rem;
    margin-top: 0.5rem;
    display: flex;
    align-items: center;
    gap: 0.75rem;
    flex-wrap: wrap;
  }
  .select-bar span { font-family: monospace; font-size: 0.8rem; color: #374151; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
</style>

<p class="breadcrumb">📁 {{ current }}</p>

<ul class="dir-list">
  {% if parent %}
  <li>
    <button class="dir-btn up-btn"
            onclick="window._loadDir('{% url 'projects:browse' %}?path={{ parent }}')">
      ↑ ..
    </button>
  </li>
  {% endif %}

  {% for entry in entries %}
  <li>
    <button class="dir-btn"
            onclick="window._loadDir('{% url 'projects:browse' %}?path={{ entry }}')">
      📁 {{ entry.name }}
    </button>
  </li>
  {% empty %}
  <li><p class="empty">No subdirectories found.</p></li>
  {% endfor %}
</ul>

<div class="select-bar">
  <span title="{{ current }}">{{ current }}</span>
  <form method="post" action="{% url 'projects:add' %}">
    {% csrf_token %}
    <input type="hidden" name="path" value="{{ current }}">
    <button class="btn btn-primary" type="submit">Select this folder</button>
  </form>
</div>
