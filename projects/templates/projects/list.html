<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Projects</title>
  <script src="https://unpkg.com/htmx.org@2.0.4/dist/htmx.min.js" crossorigin="anonymous"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      background: #f5f5f5;
      color: #111;
      padding: 2rem;
    }

    h1 { font-size: 1.4rem; margin-bottom: 1.5rem; }

    /* project cards */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    .project-card {
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 10px;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      transition: box-shadow 0.15s;
    }
    .project-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.08); }
    .card-icon { font-size: 1.6rem; line-height: 1; }
    .card-name { font-weight: 600; font-size: 0.95rem; word-break: break-all; }
    .card-path { font-family: monospace; font-size: 0.75rem; color: #6b7280; word-break: break-all; flex: 1; }
    .card-footer { margin-top: 0.5rem; display: flex; justify-content: flex-end; }

    /* buttons */
    .btn {
      display: inline-block;
      padding: 0.45rem 1rem;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 0.85rem;
      font-family: inherit;
    }
    .btn-primary { background: #2563eb; color: #fff; }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-danger  { background: transparent; color: #dc2626; border: 1px solid #dc2626; padding: 0.3rem 0.7rem; }
    .btn-danger:hover { background: #fef2f2; }

    /* dialog / modal */
    dialog {
      position: fixed;
      inset: 0;
      margin: auto;
      border: none;
      border-radius: 10px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.25);
      padding: 0;
      width: 580px;
      max-width: 95vw;
      height: 520px;
      max-height: 85vh;
      overflow: hidden;
    }
    dialog[open] {
      display: flex;
      flex-direction: column;
    }
    dialog::backdrop { background: rgba(0,0,0,0.45); }

    .dialog-header {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.1rem 1.25rem 0.9rem;
      border-bottom: 1px solid #e5e7eb;
    }
    .dialog-header h2 { font-size: 1rem; font-weight: 600; }
    .btn-close {
      appearance: none;
      -webkit-appearance: none;
      background: none;
      border: none;
      font-size: 1.1rem;
      cursor: pointer;
      color: #9ca3af;
      line-height: 1;
      padding: 0.25rem 0.4rem;
      border-radius: 4px;
    }
    .btn-close:hover { background: #f3f4f6; color: #374151; }

    #browser-content { flex: 1; overflow-y: auto; padding: 1rem 1.25rem; min-height: 0; }
    .loading { color: #9ca3af; font-size: 0.85rem; padding: 0.5rem 0; }
  </style>
</head>
<body>

<h1>Project Paths</h1>

{% if projects %}
<div class="card-grid">
  {% for p in projects %}
  <div class="project-card">
    <div class="card-icon">📁</div>
    <div class="card-name">{{ p.name }}</div>
    <div class="card-path">{{ p.path }}</div>
    <div class="card-footer">
      <form method="post" action="{% url 'projects:remove' p.pk %}">
        {% csrf_token %}
        <button class="btn btn-danger" type="submit">Remove</button>
      </form>
    </div>
  </div>
  {% endfor %}
</div>
{% else %}
<p style="margin-bottom:1.5rem;color:#6b7280;">No project paths yet.</p>
{% endif %}

<form style="display:none">{% csrf_token %}</form>
<button class="btn btn-primary" onclick="openBrowser()">+ Add Project</button>

<dialog id="browser-dialog">
  <div class="dialog-header">
    <h2>Select a folder</h2>
    <button type="button" class="btn-close" aria-label="Close"
            onclick="document.getElementById('browser-dialog').close()">✕</button>
  </div>
  <div id="browser-content">
    <p class="loading">Loading…</p>
  </div>
</dialog>

<script>
  const _dialog = document.getElementById('browser-dialog');
  const _content = document.getElementById('browser-content');
  const _browseUrl = "{% url 'projects:browse' %}";

  async function openBrowser() {
    _dialog.showModal();
    await loadDir(_browseUrl);
  }

  async function loadDir(url) {
    try {
      const res = await fetch(url);
      _content.innerHTML = await res.text();
    } catch (e) {
      _content.innerHTML = '<p style="color:#dc2626;padding:.5rem 0">Failed to load directory.</p>';
    }
  }

  window._loadDir = loadDir;

  // Close on backdrop click
  _dialog.addEventListener('click', function(e) {
    if (e.target === this) this.close();
  });

  // Arc/Safari bfcache restores the page with the dialog already open but
  // without the backdrop, leaving it in a broken non-closeable state.
  // Reset it immediately on any page restoration.
  window.addEventListener('pageshow', function() {
    if (_dialog.open) {
      _dialog.close();
      _content.innerHTML = '<p class="loading">Loading…</p>';
    }
  });
</script>

</body>
</html>
