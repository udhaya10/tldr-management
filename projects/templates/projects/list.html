<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Projects</title>
  <script src="https://unpkg.com/htmx.org@2.0.4/dist/htmx.min.js" crossorigin="anonymous"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      background: #f5f5f5;
      color: #111;
      padding: 2rem;
    }

    h1 { font-size: 1.4rem; margin-bottom: 1.5rem; }

    /* project list */
    .project-list { list-style: none; margin-bottom: 1.5rem; }
    .project-list li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      padding: 0.6rem 1rem;
      margin-bottom: 0.5rem;
      font-family: monospace;
      font-size: 0.9rem;
    }

    /* buttons */
    .btn {
      display: inline-block;
      padding: 0.45rem 1rem;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 0.85rem;
      font-family: inherit;
    }
    .btn-primary { background: #2563eb; color: #fff; }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-danger  { background: transparent; color: #dc2626; border: 1px solid #dc2626; padding: 0.3rem 0.7rem; }
    .btn-danger:hover { background: #fef2f2; }

    /* dialog / modal */
    dialog {
      border: none;
      border-radius: 10px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.18);
      padding: 0;
      width: 560px;
      max-width: 95vw;
      max-height: 80vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    dialog::backdrop { background: rgba(0,0,0,0.4); }

    .dialog-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 1.25rem 0.75rem;
      border-bottom: 1px solid #e5e7eb;
    }
    .dialog-header h2 { font-size: 1rem; }
    .btn-close {
      background: none;
      border: none;
      font-size: 1.2rem;
      cursor: pointer;
      color: #6b7280;
      line-height: 1;
    }
    .btn-close:hover { color: #111; }

    #browser-content { flex: 1; overflow-y: auto; padding: 1rem 1.25rem; }
  </style>
</head>
<body>

<h1>Project Paths</h1>

{% if projects %}
<ul class="project-list">
  {% for p in projects %}
  <li>
    <span>{{ p.path }}</span>
    <form method="post" action="{% url 'projects:remove' p.pk %}">
      {% csrf_token %}
      <button class="btn btn-danger" type="submit">Remove</button>
    </form>
  </li>
  {% endfor %}
</ul>
{% else %}
<p style="margin-bottom:1.5rem;color:#6b7280;">No project paths yet.</p>
{% endif %}

<form style="display:none">{% csrf_token %}</form>
<button class="btn btn-primary" onclick="openBrowser()">+ Add Project</button>

<dialog id="browser-dialog">
  <div class="dialog-header">
    <h2>Select a folder</h2>
    <button class="btn-close" onclick="closeBrowser()" aria-label="Close">✕</button>
  </div>
  <div id="browser-content">
    <!-- HTMX loads the directory listing here when the dialog opens -->
  </div>
</dialog>

<script>
  const dialog = document.getElementById('browser-dialog');

  function openBrowser() {
    htmx.ajax('GET', '{% url "projects:browse" %}', {target: '#browser-content', swap: 'innerHTML'});
    dialog.showModal();
  }

  function closeBrowser() {
    dialog.close();
  }

  // Close on backdrop click
  dialog.addEventListener('click', (e) => {
    if (e.target === dialog) closeBrowser();
  });
</script>

</body>
</html>
